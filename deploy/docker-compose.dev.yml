# ---------------------------------------------------------------------------
#  Lightweight stack: just Redis + Postgres for local development.
#
#  Run NautilusTrader on your host machine (with Cython compiled locally).
#
#  Usage:
#    docker compose -f deploy/docker-compose.dev.yml up -d
#    python deploy/scripts/start_demo_node.py
# ---------------------------------------------------------------------------

services:
  redis:
    container_name: nautilus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    container_name: nautilus-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nautilus
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: nautilus
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../schema/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautilus"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
